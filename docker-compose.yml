
services:
  library-app:
    container_name: container_api_service
    image: applibrary:latest
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - ${PORT}:${PORT}
    restart: always
    env_file:
      - .env
    environment:
      PORT: ${PORT}
      DATABASE_URL: ${URL_FOR_DOCKER}
    depends_on:
      - postgres
    volumes:
      - ./src:/app/src
    networks:
      - library
  postgres:
    image: postgres:latest 
    container_name: postgres_container
    restart: always
    env_file:
      - .env
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - 5433:5432 
    volumes:
      - postgres_data:/var/lib/postgresql/data 
    networks:
      - library

networks:
  library:
    driver: bridge

volumes:
  postgres_data:
