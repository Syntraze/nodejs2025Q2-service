version: '3.8'

services:
  
  postgres:
    image: postgres:latest 
    container_name: my-postgres
    restart: always
    env_file:
      - .env
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - ${POSTGRES_PORT}:${POSTGRES_PORT}
    volumes:
      - postgres_data:/var/lib/postgresql/data 
    networks:
      - library

networks:
  library:
    driver: bridge

volumes:
  postgres_data:
